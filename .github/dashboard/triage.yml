# Per-issue triage: lane/area/type/priority labels to ADD, plus the milestone.
#
# Applied by .github/workflows/dashboard-bootstrap.yml (gh issue edit
# --add-label / --milestone). Labels are ADDED, never removed, so the six
# issues that were already partially labelled keep what they had and just gain
# their lane (and a milestone where one applies).
#
# Lane definitions:
#   lane/functional  - features delivering the comic/persona/chat/voice experience
#   lane/technical   - infra / non-functional (boot, services, perf, tests, refactors)
#   lane/improvement - known defects / polish in existing behavior
#
# milestone: "" means intentionally unassigned (pure maintenance/investigation
# that doesn't ladder up to one of the four product goals) so the milestone
# progress bars stay meaningful.

issues:
  # ---------- lane/functional ----------
  - number: 441   # feat(tools): api_vision_client for autonomous vision mid-tool
    add_labels: ["lane/functional", "area/vision", "type/feature", "priority/p3"]
    milestone: ""
  - number: 440   # feat(audio): scaffold static prompts/messages for the interaction lifecycle
    add_labels: ["lane/functional", "area/audio", "type/feature", "priority/p2"]
    milestone: "Gemini chat MVP"
  - number: 439   # bookmark: persona -> xtts voice mapping (per-comic voice clones)
    add_labels: ["lane/functional", "area/voice", "type/feature", "priority/p2"]
    milestone: "Local voice clone + STT"
  - number: 240   # feat(gemini-live): enable presence-backoff by default
