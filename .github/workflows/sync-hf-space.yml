name: Sync to Hugging Face Space

# Called by release.yml for every release. Run it by hand to re-sync a tag.
on:
  workflow_call:
    inputs:
      ref:
        description: "Tag to sync"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to sync (e.g. v1.1.0); empty syncs the selected ref"
        required: false
        type: string

concurrency:
  group: hf-sync
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment: production-hf-space

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          lfs: true
          persist-credentials: false
      - name: Sync GitHub to Hugging Face Hub
        uses: huggingface/hub-sync@da166beda9a9aff15d1de9a82c6dc86c410ea3ee  # v0.2.1
        with:
          github_repo_id: pollen-robotics/reachy_mini_conversation_app
          huggingface_repo_id: pollen-robotics/reachy_mini_conversation_app
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
